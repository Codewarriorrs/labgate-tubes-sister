<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <rect width="950" height="500" fill="#f8fafc"/>
  <text x="475" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">
    Diagram Arsitektur Deployment LabGate
  </text>
  <text x="475" y="65" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">
    Pemisahan Service Cloud (Vercel + Neon) dan Service Edge Gateway Lokal
  </text>

  <!-- CLOUD ZONE -->
  <rect x="50" y="95" width="380" height="360" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="125" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">INFRASTRUKTUR CLOUD (PRODUCTION)</text>

  <rect x="70" y="150" width="340" height="130" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">Vercel Serverless Platform</text>
  <text x="240" y="195" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Service 1: Next.js 14 App Router</text>
  <text x="240" y="215" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; HTTPS Rest Endpoint (/api/*)</text>
  <text x="240" y="235" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Swagger UI Interaktif (/api-docs)</text>
  <text x="240" y="255" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Zero-Downtime Global Edge CDN</text>

  <rect x="70" y="300" width="340" height="120" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="325" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">Neon Serverless PostgreSQL</text>
  <text x="240" y="345" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Basis Data Relasional Cloud</text>
  <text x="240" y="365" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Extension btree_gist &amp; Exclusion Constraint</text>
  <text x="240" y="385" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Pencegahan Bentrok Jadwal di Server</text>

  <!-- LOCAL ZONE -->
  <rect x="520" y="95" width="380" height="360" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="710" y="125" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#065f46">INFRASTRUKTUR LOKAL (GEDUNG LAB)</text>

  <rect x="540" y="150" width="340" height="150" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="710" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">Mini PC / Laptop Kiosk Pintu (Port 4000)</text>
  <text x="710" y="195" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Service 2: Node.js + Express TypeScript</text>
  <text x="710" y="215" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; SQLite Lokal (data/gateway.db)</text>
  <text x="710" y="235" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Kiosk UI &amp; Webcam QR BarcodeDetector</text>
  <text x="710" y="255" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Mesin Keputusan Offline 24 Jam</text>
  <text x="710" y="275" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Emergency Override PIN: 1722</text>

  <rect x="540" y="320" width="340" height="110" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="710" y="345" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">Periferal Pintu &amp; MQTT Broker</text>
  <text x="710" y="365" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Mosquitto Broker Lokal / HiveMQ Wokwi</text>
  <text x="710" y="385" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; ESP32 RFID-RC522 + LCD 16x2 + Relay Solenoid</text>
  <text x="710" y="405" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">&bull; Komunikasi MQTT Topic labgate/&lt;room_code&gt;</text>

  <!-- INTER-SERVICE PIPE -->
  <path d="M 430 220 L 520 220" stroke="#1e3a8a" stroke-width="4"/>
  <rect x="445" y="195" width="60" height="25" rx="5" fill="#1e293b"/>
  <text x="475" y="212" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#ffffff">REST API</text>
</svg>

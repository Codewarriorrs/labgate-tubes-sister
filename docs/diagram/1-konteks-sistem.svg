<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="#f8fafc"/>

  <!-- Title -->
  <text x="500" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">
    Diagram Konteks &amp; Arsitektur Sistem LabGate
  </text>
  <text x="500" y="70" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">
    Dua Service Mandiri (HTTP REST) + Satu Perangkat Fisik (MQTT)
  </text>

  <!-- Box 1: PENGGUNA -->
  <rect x="50" y="110" width="220" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="110" width="220" height="40" rx="16" fill="#f1f5f9"/>
  <text x="160" y="135" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">PENGGUNA SISTEM</text>
  
  <rect x="70" y="170" width="180" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="160" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">Mahasiswa</text>
  <text x="160" y="215" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Booking &amp; Tiket QR</text>

  <rect x="70" y="250" width="180" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="160" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">Dosen &amp; Admin</text>
  <text x="160" y="295" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Approval &amp; Remote Unlock</text>

  <!-- Box 2: SERVICE 1 (CLOUD) -->
  <rect x="360" y="110" width="280" height="230" rx="16" fill="url(#cloudGrad)" stroke="#1e3a8a" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="145" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">SERVICE 1: CLOUD</text>
  <text x="500" y="165" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#93c5fd">Web Booking &amp; REST API Server (Vercel)</text>

  <rect x="380" y="185" width="240" height="50" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#60a5fa"/>
  <text x="500" y="205" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Next.js 14 App Router</text>
  <text x="500" y="222" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#bfdbfe">Mobile-First UI &amp; Swagger (/api-docs)</text>

  <rect x="380" y="250" width="240" height="65" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#60a5fa"/>
  <text x="500" y="272" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Basis Data Relasional</text>
  <text x="500" y="290" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#bfdbfe">PostgreSQL (Neon) &bull; Exclusion Constraint</text>
  <text x="500" y="305" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#93c5fd">Pencegahan Bentrok Jadwal di Database</text>

  <!-- Box 3: SERVICE 2 (GATEWAY) -->
  <rect x="360" y="390" width="280" height="220" rx="16" fill="url(#edgeGrad)" stroke="#047857" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="420" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">SERVICE 2: GATEWAY LOKAL</text>
  <text x="500" y="440" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#a7f3d0">Edge Gateway &amp; Kiosk (Port 4000)</text>

  <rect x="380" y="455" width="240" height="50" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#34d399"/>
  <text x="500" y="475" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Node.js Express &amp; Mesin Keputusan</text>
  <text x="500" y="492" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#d1fae5">Validasi RFID &amp; Kriptografi QR Ed25519</text>

  <rect x="380" y="520" width="240" height="65" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#34d399"/>
  <text x="500" y="542" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">SQLite Lokal (better-sqlite3)</text>
  <text x="500" y="560" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#d1fae5">Offline Cache Snapshot &amp; Outbox Logs</text>
  <text x="500" y="575" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#a7f3d0">Emergency PIN Override: 1722</text>

  <!-- Box 4: PERIFERAL ESP32 -->
  <rect x="730" y="390" width="220" height="220" rx="16" fill="url(#deviceGrad)" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="420" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">PERANGKAT PERIFERAL</text>
  <text x="840" y="440" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" fill="#fde68a">ESP32 (Bukan Service)</text>

  <rect x="750" y="455" width="180" height="130" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#fbbf24"/>
  <text x="840" y="480" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Simulasi Wokwi / Fisik</text>
  <text x="840" y="505" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#fef3c7">&bull; RFID MFRC522 (KTM)</text>
  <text x="840" y="525" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#fef3c7">&bull; LCD I2C 16x2 Display</text>
  <text x="840" y="545" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#fef3c7">&bull; Relay Solenoid Pintu</text>
  <text x="840" y="565" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#fef3c7">&bull; Buzzer &amp; LED Indikator</text>

  <!-- LINES & LABELS -->
  <!-- Users to Cloud -->
  <path d="M 270 200 L 360 200" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="315" y="190" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1e3a8a">HTTP REST</text>

  <!-- Cloud to Gateway (Inter-Service) -->
  <path d="M 480 340 L 480 390" stroke="#2563eb" stroke-width="4"/>
  <path d="M 520 390 L 520 340" stroke="#10b981" stroke-width="4"/>
  <rect x="420" y="350" width="160" height="30" rx="6" fill="#1e293b"/>
  <text x="500" y="365" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#ffffff">KOMUNIKASI INTER-SERVICE</text>
  <text x="500" y="376" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#93c5fd">GET &bull; POST &bull; PUT &bull; DELETE</text>

  <!-- Gateway to ESP32 (MQTT) -->
  <path d="M 640 500 L 730 500" stroke="#f59e0b" stroke-width="3"/>
  <text x="685" y="490" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#d97706">MQTT Broker</text>
  <text x="685" y="515" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#78350f">scan / cmd</text>

  <!-- User to Kiosk Scan -->
  <path d="M 160 340 L 160 500 L 360 500" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="240" y="490" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#475569">Scan QR Webcam / Tap</text>
</svg>
